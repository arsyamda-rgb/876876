name: VeyrionWardrobe
version: '${project.version}'
main: com.veyrion.wardrobe.VeyrionWardrobe
api-version: '1.21'
description: Wardrobe and Aether Mirror for the Veyrion server.
authors: [Veyrion]
# All three are hard dependencies: Paper loads them first and refuses to load this plugin without them.
# DependencyGuard then checks versions and APIs and disables the plugin with a clear message if one does not fit.
depend: [VeyrionCharacter, ItemsAdder, SkinsRestorer]

commands:
  wardrobe:
    description: Trust other players on your Aether Mirror (admins: give, remove, reload, list).
    usage: "/<command> trust <player> | untrust <player> | trustlist | give <player> | remove | reload | list [page]"

permissions:
  veyrionwardrobe.admin:
    description: Admin commands of /wardrobe (give, remove, reload, list) and breaking any mirror.
    default: op
